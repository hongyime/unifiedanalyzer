# Test-only docker compose: spins up a clean Postgres, applies the
# schema, then runs the full pytest suite (including DB integration
# tests) and exits.
#
# Usage:
#   docker compose -f docker/docker-compose.test.yml up --build --exit-code-from test-runner
#
# Exit code mirrors pytest: 0 = all passed, non-zero = failure.
# Remove the containers after a run:
#   docker compose -f docker/docker-compose.test.yml down -v

services:

  # ── Fresh Postgres for tests ────────────────────────────────────────
  test-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      POSTGRES_DB: unifiedanalyzer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d unifiedanalyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Data is ephemeral — no volume mount, so every run starts clean.

  # ── Test runner ─────────────────────────────────────────────────────
  test-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      test-postgres:
        condition: service_healthy
    environment:
      ANALYZER_DATABASE_URL: postgres://collector:collector@test-postgres:5432/unifiedanalyzer
      COLLECTOR_DATABASE_URL: postgres://collector:collector@test-postgres:5432/unifiedanalyzer
      # Disable heavy optional features that need GPU/drive mounts.
      RUN_SCHEDULER: "0"
      ENTITY_ENRICHMENT_ENABLED: "0"
      FACE_WORKER_ENABLED: "0"
      ANALYZER_DB_BACKUP_ENABLED: "0"
      # Silence noisy optional integrations.
      TELEGRAM_BOT_TOKEN: ""
      SUPABASE_INDICATOR_EXPORT_MODE: "disabled"
    command: >
      sh -c "
        echo '=== Applying schema ===' &&
        python -m src.main schema &&
        echo '=== Running test suite ===' &&
        python -m pytest tests/ -q
          --cov=src
          --cov-report=term-missing
          --cov-fail-under=40
      "
    # Propagate the pytest exit code so --exit-code-from works.
    restart: "no"
