# Cap container log growth. Docker's json-file logs live INSIDE the C:-backed
# WSL2 vhdx, so uncapped logs are one of the few ways these long-running services
# can quietly grow the disk. 3 x 10MB = 30MB max per service (oldest rotated out).
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  analyzer:
    # Dashboard image bundles the built frontend + API + scheduler.
    # Auto-starts with Docker Desktop via restart: unless-stopped.
    image: unifiedanalyzer:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    # Host API_PORT is 8002 (avoids colliding with the collector dashboard on 8001).
    ports:
      - "8002:8002"
    env_file:
      - ../.env
    environment:
      # In-container overrides of the host-oriented .env values:
      # reach the collector Postgres by its container name on the shared network
      # (host .env uses localhost:5500, which is only valid on the host).
      ANALYZER_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedanalyzer
      COLLECTOR_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedcollector
      # Derived media lives on Z: on the host; mounted into the container below.
      MEDIA_DERIVED_PATH: /app/media_derived
      # COLLECTOR_MEDIA_ROOT is the dir that CONTAINS the "media/" folder.
      COLLECTOR_MEDIA_ROOT: /app/collector_root
      # Face artifacts (crops/FAISS/thumbs/InsightFace cache) under the mounted
      # derived dir — container path, not the host Z: path from .env.
      FACE_MODEL_ROOT: /app/media_derived/faces
      # API only — the scheduler runs as a SEPARATE process (the `scheduler`
      # service below) so its blocking Phase-6 work never freezes the dashboard.
      RUN_SCHEDULER: "0"
    volumes:
      # Collector media (read-only) for thumbnails of real media items.
      - "Z:/unifiedcollector/media:/app/collector_root/media:ro"
      # Derived artifacts (PDF images / video frames / ONNX models) on Z:.
      - "Z:/unifiedanalyzer/media_derived:/app/media_derived"
    networks:
      - unifiedcollector_default
    restart: unless-stopped
    logging: *default-logging

  # Analysis scheduler: a SEPARATE process running the periodic incremental /
  # full-resolution pipeline (Phase 6 media analysis, identity resolution,
  # notifications). Split out of the API container because its blocking cv2 /
  # ffmpeg / pypdf calls would otherwise freeze the uvicorn event loop — and the
  # dashboard with it — for the whole run. Reuses the same image; owns the
  # Telegram run-summary + heartbeat notifications.
  scheduler:
    image: unifiedanalyzer:latest
    depends_on:
      - analyzer
    command: ["python", "-m", "src.main", "scheduler"]
    env_file:
      - ../.env
    environment:
      ANALYZER_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedanalyzer
      COLLECTOR_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedcollector
      MEDIA_DERIVED_PATH: /app/media_derived
      COLLECTOR_MEDIA_ROOT: /app/collector_root
      FACE_MODEL_ROOT: /app/media_derived/faces
    volumes:
      - "Z:/unifiedcollector/media:/app/collector_root/media:ro"
      - "Z:/unifiedanalyzer/media_derived:/app/media_derived"
    networks:
      - unifiedcollector_default
    restart: unless-stopped
    logging: *default-logging
    # Soft CPU priority: this heavy background pipeline (cv2/ffmpeg/pdf/ONNX)
    # yields under contention so it never starves host-critical neighbours
    # (pihole DNS, plex, the collector). Full speed when the host is idle.
    cpu_shares: 512

  # Face indexing worker (merge §6): a SEPARATE long-running process (SQLAlchemy
  # + ONNX threads) from the analyzer's asyncio API/scheduler. Reuses the same
  # image; runs the continuous loop. No-op until collector source media is
  # restored (task B1). Reads/writes the same Z: derived + model dirs and the
  # shared analyzer DB.
  face_worker:
    image: unifiedanalyzer:latest
    depends_on:
      - analyzer
    # nice the worker so the collectors (Telegram/WA/IG + RabbitMQ/Postgres) win
    # CPU contention. Combined with the hard cpus cap below, face_worker becomes
    # a low-priority background trickle that can't starve the shared box.
    command: ["nice", "-n", "10", "python", "-m", "src.face_worker", "loop"]
    env_file:
      - ../.env
    environment:
      ANALYZER_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedanalyzer
      COLLECTOR_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedcollector
      MEDIA_DERIVED_PATH: /app/media_derived
      COLLECTOR_MEDIA_ROOT: /app/collector_root
      FACE_MODEL_ROOT: /app/media_derived/faces
      # ---- CPU containment (face_worker is the box's heaviest consumer) ----
      # Cap ML/BLAS/cv2 threading so ONNX/numpy don't fan out to ALL cores (the
      # cause of the 250% spikes). The hard `cpus:` cgroup limit below is the
      # guaranteed ceiling; these keep it from thrashing within that budget.
      # FACE_ONNX_THREADS is read by the detector to cap ONNX intra-op threads.
      OMP_NUM_THREADS: "${FACE_WORKER_THREADS:-2}"
      MKL_NUM_THREADS: "${FACE_WORKER_THREADS:-2}"
      OPENBLAS_NUM_THREADS: "${FACE_WORKER_THREADS:-2}"
      NUMEXPR_NUM_THREADS: "${FACE_WORKER_THREADS:-2}"
      VECLIB_MAXIMUM_THREADS: "${FACE_WORKER_THREADS:-2}"
      FACE_ONNX_THREADS: "${FACE_ONNX_THREADS:-2}"
      # ---- Drive face-scanning (W/X/Y/Z) ----
      # DriveScanner walks these container paths and feeds image files through
      # the SAME InsightFace detect->index flow as collector media (see
      # src/face_worker.py:ingest_drive_media). C: is DELIBERATELY ABSENT —
      # walking C: hydrates OneDrive placeholders and fills the disk (retired
      # facetracker's exact failure; see memory onedrive-hydration-hazard).
      # Y:/Z: are local. W:/X: are SMB shares on Tailscale host Prawn-E14
      # (100.92.164.125), mounted as CIFS volumes (see top-level `volumes:`).
      DRIVE_SOURCES: >-
        [{"path": "/mnt/w", "type": "local"},
         {"path": "/mnt/x", "type": "local"},
         {"path": "/mnt/y", "type": "local"},
         {"path": "/mnt/z", "type": "local"}]
      # Prefix-excluded subtrees: the analyzer's own derived face crops (would
      # be a circular re-detect), collector media already indexed via the
      # collector path (avoid dupes), and OS junk dirs.
      # NOTE: $$ escapes a literal $ — docker-compose interpolates single $,
      # so "$RECYCLE.BIN" must be written "$$RECYCLE.BIN" to survive.
      EXCLUDE_PATHS: >-
        ["/mnt/z/unifiedanalyzer", "/mnt/z/unifiedcollector",
         "/mnt/z/$$RECYCLE.BIN", "/mnt/z/System Volume Information",
         "/mnt/y/facetracker", "/mnt/y/unifiedcollector",
         "/mnt/y/$$RECYCLE.BIN", "/mnt/y/System Volume Information",
         "/mnt/w/$$RECYCLE.BIN", "/mnt/w/System Volume Information",
         "/mnt/x/$$RECYCLE.BIN", "/mnt/x/System Volume Information"]
    volumes:
      - "Z:/unifiedcollector/media:/app/collector_root/media:ro"
      - "Z:/unifiedanalyzer/media_derived:/app/media_derived"
      # Whole-drive read-only mounts for face scanning. Read-only: the worker
      # only reads pixels, never writes to the scanned drives.
      - "Y:/:/mnt/y:ro"
      - "Z:/:/mnt/z:ro"
      # W:/X: are SMB/CIFS volumes (defined under top-level `volumes:`) — the
      # host's mapped network drives aren't visible to Docker's WSL2 backend, so
      # the container mounts the share itself over Tailscale.
      - "wdrive:/mnt/w:ro"
      - "xdrive:/mnt/x:ro"
    networks:
      - unifiedcollector_default
    restart: unless-stopped
    logging: *default-logging
    # Soft CPU priority — same as the scheduler: ONNX face inference yields to
    # host-critical neighbours under contention rather than pegging cores.
    cpu_shares: 512
    # HARD CPU ceiling (cgroup): face_worker physically cannot exceed this many
    # cores no matter how many threads ONNX/cv2 spawn — the single most important
    # guard against saturating the shared box. Default 2.0; tune via env.
    cpus: "${FACE_WORKER_MAX_CPUS:-2.0}"

# CIFS volumes for the W:/X: drives on Tailscale host Prawn-E14. Credentials
# come from .env (SMB_HOST/SMB_USER/SMB_PASS, gitignored) — pass
# `--env-file ../.env` to docker compose so these ${...} refs interpolate.
# Mounted read-only (ro) — face scanning never writes to the shares.
volumes:
  wdrive:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_HOST}/w-drive"
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,uid=0,gid=0,file_mode=0444,dir_mode=0555"
  xdrive:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_HOST}/x-drive"
      o: "username=${SMB_USER},password=${SMB_PASS},vers=3.0,ro,uid=0,gid=0,file_mode=0444,dir_mode=0555"

networks:
  unifiedcollector_default:
    external: true
