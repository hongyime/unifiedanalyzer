services:
  analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    volumes:
      - "Z:/unifiedcollector/media:/media:ro"
    networks:
      - unifiedcollector_default
    restart: unless-stopped

networks:
  unifiedcollector_default:
    external: true
