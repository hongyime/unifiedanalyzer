# Cap container log growth. Docker's json-file logs live INSIDE the C:-backed
# WSL2 vhdx, so uncapped logs are one of the few ways these long-running services
# can quietly grow the disk. 3 x 10MB = 30MB max per service (oldest rotated out).
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  analyzer:
    # Dashboard image bundles the built frontend + API + scheduler.
    # Auto-starts with Docker Desktop via restart: unless-stopped.
    image: unifiedanalyzer:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    # Host API_PORT is 8002 (avoids colliding with the collector dashboard on 8001).
    ports:
      - "8002:8002"
    env_file:
      - ../.env
    environment:
      # In-container overrides of the host-oriented .env values:
      # reach the collector Postgres by its container name on the shared network
      # (host .env uses localhost:5500, which is only valid on the host).
      ANALYZER_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedanalyzer
      COLLECTOR_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedcollector
      # Derived media lives on Z: on the host; mounted into the container below.
      MEDIA_DERIVED_PATH: /app/media_derived
      # COLLECTOR_MEDIA_ROOT is the dir that CONTAINS the "media/" folder.
      COLLECTOR_MEDIA_ROOT: /app/collector_root
      # Face artifacts (crops/FAISS/thumbs/InsightFace cache) under the mounted
      # derived dir — container path, not the host Z: path from .env.
      FACE_MODEL_ROOT: /app/media_derived/faces
      # API only — the scheduler runs as a SEPARATE process (the `scheduler`
      # service below) so its blocking Phase-6 work never freezes the dashboard.
      RUN_SCHEDULER: "0"
    volumes:
      # Collector media (read-only) for thumbnails of real media items.
      - "Z:/unifiedcollector/media:/app/collector_root/media:ro"
      # Derived artifacts (PDF images / video frames / ONNX models) on Z:.
      - "Z:/unifiedanalyzer/media_derived:/app/media_derived"
    networks:
      - unifiedcollector_default
    restart: unless-stopped
    logging: *default-logging

  # Analysis scheduler: a SEPARATE process running the periodic incremental /
  # full-resolution pipeline (Phase 6 media analysis, identity resolution,
  # notifications). Split out of the API container because its blocking cv2 /
  # ffmpeg / pypdf calls would otherwise freeze the uvicorn event loop — and the
  # dashboard with it — for the whole run. Reuses the same image; owns the
  # Telegram run-summary + heartbeat notifications.
  scheduler:
    image: unifiedanalyzer:latest
    depends_on:
      - analyzer
    command: ["python", "-m", "src.main", "scheduler"]
    env_file:
      - ../.env
    environment:
      ANALYZER_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedanalyzer
      COLLECTOR_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedcollector
      MEDIA_DERIVED_PATH: /app/media_derived
      COLLECTOR_MEDIA_ROOT: /app/collector_root
      FACE_MODEL_ROOT: /app/media_derived/faces
    volumes:
      - "Z:/unifiedcollector/media:/app/collector_root/media:ro"
      - "Z:/unifiedanalyzer/media_derived:/app/media_derived"
    networks:
      - unifiedcollector_default
    restart: unless-stopped
    logging: *default-logging
    # Soft CPU priority: this heavy background pipeline (cv2/ffmpeg/pdf/ONNX)
    # yields under contention so it never starves host-critical neighbours
    # (pihole DNS, plex, the collector). Full speed when the host is idle.
    cpu_shares: 512

  # Face indexing worker (merge §6): a SEPARATE long-running process (SQLAlchemy
  # + ONNX threads) from the analyzer's asyncio API/scheduler. Reuses the same
  # image; runs the continuous loop. No-op until collector source media is
  # restored (task B1). Reads/writes the same Z: derived + model dirs and the
  # shared analyzer DB.
  face_worker:
    image: unifiedanalyzer:latest
    depends_on:
      - analyzer
    command: ["python", "-m", "src.face_worker", "loop"]
    env_file:
      - ../.env
    environment:
      ANALYZER_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedanalyzer
      COLLECTOR_DATABASE_URL: postgres://collector:collector@unifiedcollector_postgres:5432/unifiedcollector
      MEDIA_DERIVED_PATH: /app/media_derived
      COLLECTOR_MEDIA_ROOT: /app/collector_root
      FACE_MODEL_ROOT: /app/media_derived/faces
    volumes:
      - "Z:/unifiedcollector/media:/app/collector_root/media:ro"
      - "Z:/unifiedanalyzer/media_derived:/app/media_derived"
    networks:
      - unifiedcollector_default
    restart: unless-stopped
    logging: *default-logging
    # Soft CPU priority — same as the scheduler: ONNX face inference yields to
    # host-critical neighbours under contention rather than pegging cores.
    cpu_shares: 512

networks:
  unifiedcollector_default:
    external: true
