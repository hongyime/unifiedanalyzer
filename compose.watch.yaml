# Explicit source-sync overlay for SMB/remote Docker hosts. No rebuild actions.
x-watch-ignore: &watch-ignore ["**/.[eE][nN][vV]*", "**/*[sS][eE][cC][rR][eE][tT]*", "**/*[cC][rR][eE][dD][eE][nN][tT][iI][aA][lL]*", "**/*.[pP][eE][mM]", "**/*.[kK][eE][yY]", "**/*.[pP]12", "**/*.[pP][fF][xX]", "**/__pycache__/**", "**/*.pyc", "**/node_modules/**", "**/.venv/**", "**/dist/**", "**/build/**", "**/requirements*.txt", "**/requirements.lock", "**/package.json", "**/package-lock.json", "**/pyproject.toml", "**/uv.lock"]
services:
  analyzer:
    volumes: !override ["dev_input:/app/collector_root/media:ro", "dev_media:/app/media_derived", "dev_decisions:/app/decisions"]
    develop:
      watch:
      - action: sync
        path: ./src
        target: /app/src
        initial_sync: true
        ignore: *watch-ignore
      - action: sync
        path: ./data/wmn-data.json
        target: /app/data/wmn-data.json
        initial_sync: true
        ignore: *watch-ignore
  scheduler:
    volumes: !override ["dev_input:/app/collector_root/media:ro", "dev_media:/app/media_derived", "dev_decisions:/app/decisions"]
    develop:
      watch:
      - action: sync
        path: ./src
        target: /app/src
        initial_sync: true
        ignore: *watch-ignore
      - action: sync
        path: ./data/wmn-data.json
        target: /app/data/wmn-data.json
        initial_sync: true
        ignore: *watch-ignore
  face_worker:
    volumes: !override ["dev_input:/app/collector_root/media:ro", "dev_media:/app/media_derived", "dev_decisions:/app/decisions"]
    develop:
      watch:
      - action: sync
        path: ./src
        target: /app/src
        initial_sync: true
        ignore: *watch-ignore
      - action: sync
        path: ./data/wmn-data.json
        target: /app/data/wmn-data.json
        initial_sync: true
        ignore: *watch-ignore
  stream_alert_worker:
    volumes: !override ["dev_input:/app/collector_root/media:ro", "dev_media:/app/media_derived", "dev_decisions:/app/decisions"]
    develop:
      watch:
      - action: sync
        path: ./src
        target: /app/src
        initial_sync: true
        ignore: *watch-ignore
      - action: sync
        path: ./data/wmn-data.json
        target: /app/data/wmn-data.json
        initial_sync: true
        ignore: *watch-ignore
  frontend:
    volumes: !override []
    develop:
      watch:
      - action: sync
        path: ./frontend
        target: /app/frontend
        initial_sync: true
        ignore: *watch-ignore
volumes:
  dev_input: {}
